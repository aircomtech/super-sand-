<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120">
  <rect width="300" height="120" rx="16" fill="#FFCC00"/>
  <g transform="translate(15, 12)">
    <!-- Brand Name -->
    <text x="135" y="42" font-family="'Arial Black', Impact, sans-serif" font-size="34" font-weight="900" fill="#111111" text-anchor="middle" letter-spacing="-0.5">UltraTech</text>
    <!-- Red Accent Bar -->
    <rect x="25" y="52" width="220" height="6" fill="#D9222A" rx="2"/>
    <!-- Product Category -->
    <text x="135" y="80" font-family="'Arial Black', Impact, sans-serif" font-size="24" font-weight="900" fill="#111111" text-anchor="middle" letter-spacing="4">CEMENT</text>
    <!-- Tagline -->
    <text x="135" y="98" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" letter-spacing="0.5">The Engineer&apos;s Choice</text>
  </g>
</svg>